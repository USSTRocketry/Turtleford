; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir  = Src
include_dir = Include
test_dir = Test
lib_dir  = Lib

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli

build_flags = 
    -D TEENSY_OPT_SMALLEST_CODE_LTO
    -DPB_BUFFER_ONLY

build_src_flags = 
    -std=gnu++20
    -Wall
    -Wextra
    -Wpedantic
    -Wshadow
    -Wdouble-promotion
    -Wundef
    -ffunction-sections
    -fdata-sections
    -fno-exceptions
    -fno-rtti
    -Wl,-Map=output.map
    
    -D _TASK_HEADER_AND_CPP
    -D WORK_QUEUE_PREEMPTIVE=false
    -D USST_PLATFORM_ARDUINO

extra_scripts = 
    RemoveLibWarnings.py
    pre:Compiledb.py

lib_deps = 
    SPI
    RadioHead
    https://github.com/adafruit/Adafruit_BMP280_Library
    https://github.com/adafruit/Adafruit_BusIO
    https://github.com/adafruit/Adafruit_LIS3MDL
    https://github.com/adafruit/Adafruit_LSM6DS
    https://github.com/adafruit/Adafruit_MCP9808
    https://github.com/adafruit/Adafruit_Sensor
    arkhipenko/TaskScheduler
    git@github.com:adafruit/RadioHead.git

